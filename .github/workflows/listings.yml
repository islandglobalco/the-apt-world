name: Refresh Manhattan listings
on:
  schedule:
    - cron: "17 11 */3 * *"   # every third day, 6:17am Central
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - scripts/fetch_listings.py
      - .github/workflows/listings.yml
permissions:
  contents: write
concurrency:
  group: listings
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Fetch and score listings
        env:
          RENTCAST_API_KEY: ${{ secrets.RENTCAST_API_KEY }}
        run: python scripts/fetch_listings.py
      - name: Commit data and usage ledger
        if: always()
        run: |
          git config user.name "apt-bot"
          git config user.email "apt-bot@users.noreply.github.com"
          git add data/ 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Refresh Manhattan listings [skip ci]" && git pull --rebase -q && git push)
